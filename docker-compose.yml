services:
  backend:
    build: ./backend
    image: backend:latest
    ports:
      - "8080:8080"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    restart: always

  frontend:
    build: ./frontend
    image: frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
